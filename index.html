<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8f5; --panel:#ffffff; --ink:#232922; --sub:#6f776d;
  --line:#e2e6dd; --accent:#2f6f5e; --accent-soft:#e2ede8;
  --trab:#3b5a8a; --trab-soft:#e7edf6;
  --renda:#a3711f; --renda-soft:#f5ead4;
  --pess:#6a4a86; --pess-soft:#efe6f5;
  --radius:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100%}
h1,h2,.brand{font-family:'Fraunces',serif}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
.hidden{display:none !important}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.authCard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px;width:100%;max-width:360px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.authCard h1{font-size:28px;margin:0 0 6px;font-weight:700}
.authCard p{color:var(--sub);margin:0 0 22px;font-size:14px}
.authCard input{width:100%;margin-bottom:10px}
.authCard button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.authSwitch{margin-top:16px;font-size:13px;color:var(--sub);text-align:center}
.authSwitch a{color:var(--accent);cursor:pointer;text-decoration:underline}
.authMsg{font-size:13px;color:var(--renda);min-height:18px;margin-top:4px}

#app{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header.top .brand{font-size:22px;font-weight:700}
header.top button{background:none;border:none;color:var(--sub);font-size:13px;text-decoration:underline}

nav.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:none;color:var(--sub);font-size:14px;padding:10px 4px;margin-right:14px;border-bottom:2px solid transparent}
nav.tabs button.active{color:var(--accent);font-weight:600;border-color:var(--accent)}

section.view{display:none}
section.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}

.formGrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.formGrid{grid-template-columns:2fr 1fr 1fr auto}}
.formGrid button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px}

.chips{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:12.5px;padding:6px 12px;border-radius:99px}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:600}

.dayGroup{margin-bottom:14px}
.dayGroup h3{font-size:13px;color:var(--sub);font-weight:600;margin:0 0 6px;text-transform:capitalize}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel)}
.row .chk{width:20px;height:20px;flex-shrink:0;border:1.5px solid var(--sub);border-radius:5px;background:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.row .chk.done{background:var(--accent);border-color:var(--accent);color:#fff}
.row .txt{flex:1;min-width:0}
.row .title{font-size:14px}
.row .title.done{text-decoration:line-through;color:var(--sub)}
.cat{font-size:10.5px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.cat.trabalho{background:var(--trab-soft);color:var(--trab)}
.cat.renda_extra{background:var(--renda-soft);color:var(--renda)}
.cat.pessoal{background:var(--pess-soft);color:var(--pess)}
.iconBtn{background:none;border:none;color:var(--sub);font-size:15px;padding:3px 5px}
.editRow{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.editRow input,.editRow select{flex:1;min-width:100px}
.editRow button{border:none;border-radius:7px;padding:7px 10px;font-size:12.5px;font-weight:600}
.editRow .save{background:var(--accent);color:#fff}
.editRow .cancel{background:var(--line);color:var(--ink)}
.empty{color:var(--sub);font-size:13.5px;padding:10px 0}

.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat .num{font-family:'Fraunces',serif;font-size:32px;font-weight:700}
.stat .lbl{font-size:13px;color:var(--sub);margin-top:2px}
.progressBar{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden;margin-top:10px}
.progressFill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.catBreak{margin-top:8px;font-size:12.5px;color:var(--sub)}
.catBreak span{display:inline-block;margin-right:12px}
</style>
</head>
<body>

<div id="authScreen">
  <div class="authCard">
    <h1>Meu Planner</h1>
    <p>Cadastre suas atividades de trabalho, renda extra e pessoais.</p>
    <input id="authEmail" type="email" placeholder="E-mail">
    <input id="authPass" type="password" placeholder="Senha">
    <button id="authSubmit" onclick="handleAuth()">Entrar</button>
    <div class="authMsg" id="authMsg"></div>
    <div class="authSwitch" id="authSwitch">Ainda não tem conta? <a onclick="toggleAuthMode()">Criar conta</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand">Meu Planner</div>
    <button onclick="logout()">Sair</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="planner" onclick="showView('planner')">Planner</button>
    <button class="tab-btn" data-view="dash" onclick="showView('dash')">Dashboard</button>
  </nav>

  <section class="view active" id="view-planner">
    <div class="card">
      <h2>Nova atividade</h2>
      <div class="formGrid">
        <input type="text" id="novoTitulo" placeholder="Nome da atividade">
        <input type="date" id="novaData">
        <select id="novaCategoria">
          <option value="trabalho">Trabalho</option>
          <option value="renda_extra">Renda extra</option>
          <option value="pessoal">Pessoal</option>
        </select>
        <button onclick="addAtividade()">Adicionar</button>
      </div>
    </div>

    <div class="chips" id="filtroChips"></div>
    <div id="listaAtividades"></div>
  </section>

  <section class="view" id="view-dash">
    <div class="card">
      <h2>Hoje</h2>
      <div class="statGrid">
        <div class="stat"><div class="num" id="hojeFeitas">0</div><div class="lbl">concluídas</div></div>
        <div class="stat"><div class="num" id="hojePlan">0</div><div class="lbl">planejadas</div></div>
      </div>
      <div class="progressBar"><div class="progressFill" id="hojeBar" style="width:0%"></div></div>
    </div>
    <div class="card">
      <h2>Esta semana</h2>
      <div class="statGrid">
        <div class="stat"><div class="num" id="semFeitas">0</div><div class="lbl">concluídas</div></div>
        <div class="stat"><div class="num" id="semPlan">0</div><div class="lbl">planejadas</div></div>
      </div>
      <div class="progressBar"><div class="progressFill" id="semBar" style="width:0%"></div></div>
      <div class="catBreak" id="semCatBreak"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mvsdxyilycfnxwvsweea.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12c2R4eWlseWNmbnh3dnN3ZWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDQ3NTgsImV4cCI6MjEwNDM4MDc1OH0.iGWhddk1kOqD2y_yg2YRb8c-6nTwsFK19PXNBnWcwGI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let atividades = [];
let isSignup = false;
let filtro = 'todos';
const catLabel = {trabalho:'Trabalho', renda_extra:'Renda extra', pessoal:'Pessoal'};
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => toISO(new Date());

function toggleAuthMode(){
  isSignup = !isSignup;
  document.getElementById('authSubmit').textContent = isSignup ? 'Criar conta' : 'Entrar';
  document.getElementById('authSwitch').innerHTML = isSignup
    ? 'Já tem conta? <a onclick="toggleAuthMode()">Entrar</a>'
    : 'Ainda não tem conta? <a onclick="toggleAuthMode()">Criar conta</a>';
}

async function handleAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  msg.textContent = '';
  if(!email || !password){ msg.textContent = 'Preencha e-mail e senha.'; return; }
  try{
    const { data, error } = isSignup
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    if(isSignup && !data.session){ msg.textContent = 'Conta criada! Verifique seu e-mail para confirmar.'; return; }
    await startApp(data.session.user);
  }catch(e){ msg.textContent = e.message; }
}

async function logout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}

async function startApp(user){
  currentUser = user;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('novaData').value = todayStr();
  await loadAtividades();
  renderAll();
}

async function loadAtividades(){
  const { data, error } = await sb.from('atividades').select('*').eq('user_id', currentUser.id).order('dia');
  atividades = error ? [] : data;
}

async function addAtividade(){
  const t = document.getElementById('novoTitulo');
  const d = document.getElementById('novaData');
  const c = document.getElementById('novaCategoria');
  if(!t.value.trim()) return;
  const row = { user_id: currentUser.id, title: t.value.trim(), dia: d.value || todayStr(), categoria: c.value, done:false };
  const { data, error } = await sb.from('atividades').insert(row).select().single();
  if(!error){ atividades.push(data); t.value=''; renderAll(); }
}
async function toggleAtividade(id){
  const it = atividades.find(i=>i.id===id); if(!it) return;
  it.done = !it.done;
  await sb.from('atividades').update({ done: it.done }).eq('id', id);
  renderAll();
}
async function deleteAtividade(id){
  atividades = atividades.filter(i=>i.id!==id);
  await sb.from('atividades').delete().eq('id', id);
  renderAll();
}
function startEdit(id){
  const it = atividades.find(i=>i.id===id);
  it._editing = true;
  renderAll();
}
function cancelEdit(id){
  const it = atividades.find(i=>i.id===id);
  delete it._editing;
  renderAll();
}
async function saveEdit(id){
  const it = atividades.find(i=>i.id===id);
  const title = document.getElementById('editTitulo-'+id).value.trim();
  const dia = document.getElementById('editData-'+id).value;
  const categoria = document.getElementById('editCat-'+id).value;
  if(!title) return;
  it.title = title; it.dia = dia; it.categoria = categoria;
  delete it._editing;
  await sb.from('atividades').update({ title, dia, categoria }).eq('id', id);
  renderAll();
}

function setFiltro(f){ filtro = f; renderAll(); }

function showView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  if(v==='dash') renderDash();
}

function fmtDia(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
}

function rowHtml(it){
  if(it._editing){
    return `<div class="row"><div class="editRow">
      <input type="text" id="editTitulo-${it.id}" value="${it.title.replace(/"/g,'&quot;')}">
      <input type="date" id="editData-${it.id}" value="${it.dia}">
      <select id="editCat-${it.id}">
        <option value="trabalho" ${it.categoria==='trabalho'?'selected':''}>Trabalho</option>
        <option value="renda_extra" ${it.categoria==='renda_extra'?'selected':''}>Renda extra</option>
        <option value="pessoal" ${it.categoria==='pessoal'?'selected':''}>Pessoal</option>
      </select>
      <button class="save" onclick="saveEdit(${it.id})">Salvar</button>
      <button class="cancel" onclick="cancelEdit(${it.id})">Cancelar</button>
    </div></div>`;
  }
  return `<div class="row">
    <button class="chk ${it.done?'done':''}" onclick="toggleAtividade(${it.id})">${it.done?'✓':''}</button>
    <div class="txt"><div class="title ${it.done?'done':''}">${it.title}</div></div>
    <span class="cat ${it.categoria}">${catLabel[it.categoria]}</span>
    <button class="iconBtn" onclick="startEdit(${it.id})">✎</button>
    <button class="iconBtn" onclick="deleteAtividade(${it.id})">×</button>
  </div>`;
}

function renderAll(){
  document.getElementById('filtroChips').innerHTML = ['todos','trabalho','renda_extra','pessoal'].map(f=>
    `<button class="chip ${filtro===f?'active':''}" onclick="setFiltro('${f}')">${f==='todos'?'Todos':catLabel[f]}</button>`
  ).join('');

  const filtradas = atividades.filter(a => filtro==='todos' || a.categoria===filtro);
  const grupos = {};
  filtradas.forEach(a => { (grupos[a.dia] = grupos[a.dia]||[]).push(a); });
  const dias = Object.keys(grupos).sort();

  document.getElementById('listaAtividades').innerHTML = dias.length
    ? dias.map(d => `<div class="dayGroup"><h3>${fmtDia(d)}</h3>${grupos[d].map(rowHtml).join('')}</div>`).join('')
    : '<p class="empty">Nenhuma atividade encontrada.</p>';

  renderDash();
}

function weekRange(){
  const now = new Date();
  const day = (now.getDay()+6)%7; // 0=segunda
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return [toISO(monday), toISO(sunday)];
}

function renderDash(){
  const today = todayStr();
  const hoje = atividades.filter(a=>a.dia===today);
  const hojeFeitas = hoje.filter(a=>a.done).length;
  document.getElementById('hojeFeitas').textContent = hojeFeitas;
  document.getElementById('hojePlan').textContent = hoje.length;
  document.getElementById('hojeBar').style.width = hoje.length ? (hojeFeitas/hoje.length*100)+'%' : '0%';

  const [ini, fim] = weekRange();
  const semana = atividades.filter(a=>a.dia>=ini && a.dia<=fim);
  const semFeitas = semana.filter(a=>a.done).length;
  document.getElementById('semFeitas').textContent = semFeitas;
  document.getElementById('semPlan').textContent = semana.length;
  document.getElementById('semBar').style.width = semana.length ? (semFeitas/semana.length*100)+'%' : '0%';

  const breakdown = ['trabalho','renda_extra','pessoal'].map(c=>{
    const list = semana.filter(a=>a.categoria===c);
    const done = list.filter(a=>a.done).length;
    return `<span>${catLabel[c]}: ${done}/${list.length}</span>`;
  }).join('');
  document.getElementById('semCatBreak').innerHTML = breakdown;
}

sb.auth.getSession().then(({data})=>{ if(data.session) startApp(data.session.user); });
</script>
</body>
</html>
<!--
SQL para rodar no Supabase (SQL Editor) — nova tabela usada por esta versão do app:

create table atividades (
  id bigint generated always as identity primary key,
  user_id uuid references auth.users not null,
  title text not null,
  dia date not null default current_date,
  categoria text not null default 'pessoal',
  done boolean default false,
  created_at timestamptz default now()
);
alter table atividades enable row level security;
create policy "own atividades" on atividades for all using (auth.uid() = user_id);

-- As tabelas antigas (rotina_items, rotina_checkins) não são mais usadas por esta versão
-- e podem ser removidas se quiser: drop table if exists rotina_items; drop table if exists rotina_checkins;
-->
