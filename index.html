<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECEDE4;
    --surface: #FFFFFF;
    --surface-soft: #F5F5EE;
    --ink: #1C1F26;
    --ink-soft: #656B60;
    --ink-faint: #A2A69A;
    --line: #E3E4D9;
    --moss: #4B6142;
    --moss-deep: #34432D;
    --moss-soft: #E3E9DC;
    --amber: #C1832E;
    --amber-soft: #F4E5CC;
    --clay: #A6493A;
    --shadow-sm: 0 1px 2px rgba(28,31,38,.05);
    --shadow-md: 0 6px 20px rgba(28,31,38,.08);
    --shadow-fab: 0 8px 22px rgba(75,97,66,.38);
    --radius: 18px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }
  :focus-visible{ outline: 2px solid var(--moss); outline-offset: 2px; }

  /* Header */
  header{
    padding: 30px 20px 16px;
  }
  .account-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .account-mail{
    font-size:12.5px;
    color: var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .account-mail b{ color: var(--moss-deep); font-weight:600; }
  .link-btn{
    border:none;
    background: var(--surface);
    color: var(--ink-soft);
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding: 7px 12px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    cursor:pointer;
    flex-shrink:0;
  }
  .link-btn:hover{ color: var(--clay); }
  .day-label{
    font-family:'Fraunces', serif;
    font-size: 38px;
    font-weight: 500;
    line-height:1.05;
    margin:0 0 4px;
    font-variation-settings: 'opsz' 40;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .date-sub{
    font-size:14px;
    color: var(--ink-soft);
    margin:0 0 20px;
  }
  .progress-card{
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .ring{
    width:46px; height:46px; flex-shrink:0;
  }
  .ring circle{ transition: stroke-dashoffset .4s ease; }
  .progress-text{
    font-size:14px;
    color: var(--ink-soft);
    margin:0;
  }
  .progress-text strong{
    color: var(--ink);
    font-weight:600;
  }

  /* Tabs */
  .tabs{
    display:flex;
    background: var(--surface-soft);
    border-radius: 999px;
    padding: 4px;
    gap:2px;
  }
  .tabs button{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    color: var(--ink-soft);
    padding: 10px 0;
    border-radius: 999px;
    cursor:pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .tabs button.active{
    background: var(--moss);
    color: white;
    box-shadow: var(--shadow-sm);
  }

  /* Task list */
  main{
    flex:1;
    padding: 4px 20px 110px;
  }
  .empty-state{
    text-align:center;
    padding: 56px 24px;
    color: var(--ink-soft);
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-top:14px;
  }
  .empty-state .glyph{
    width:40px; height:40px; margin:0 auto 14px;
    color: var(--ink-faint);
  }
  .empty-state p{ margin:0; font-size:14.5px; line-height:1.6; }

  ul.tasks{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li.task{
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding: 15px 14px;
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .15s ease;
  }
  .check{
    width:25px; height:25px;
    border-radius: 8px;
    border: 1.5px solid var(--ink-faint);
    background: transparent;
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .check:active{ transform: scale(.9); }
  .check svg{ opacity:0; transform: scale(.6); transition: opacity .15s ease, transform .15s ease; }
  li.task.done{ box-shadow:none; background: var(--surface-soft); }
  li.task.done .check{ background: var(--moss); border-color: var(--moss); }
  li.task.done .check svg{ opacity:1; transform: scale(1); }

  .task-body{ flex:1; min-width:0; }
  .task-name{
    font-size:15.5px;
    font-weight:500;
    line-height:1.35;
    transition: color .15s ease;
  }
  li.task.done .task-name{ color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--ink-faint); text-decoration-thickness: 1.2px; }

  .streak{
    display:flex;
    gap:4px;
    margin-top:9px;
  }
  .streak i{
    width:13px; height:13px;
    border-radius:4px;
    background: var(--line);
    display:block;
  }
  .streak i.hit{ background: var(--amber); }

  .item-remove{
    border:none; background:none; color: var(--ink-faint);
    font-size:19px; line-height:1; padding:4px 4px; cursor:pointer;
    opacity:.7; flex-shrink:0;
  }
  .item-remove:hover{ opacity:1; color: var(--clay); }

  /* Agenda */
  .day-group{ margin-top:20px; }
  .day-group:first-child{ margin-top:14px; }
  .day-group-label{
    font-size:12.5px;
    font-weight:600;
    color: var(--moss-deep);
    margin: 0 4px 8px;
    display:flex;
    align-items:baseline;
    gap:7px;
    text-transform: lowercase;
  }
  .day-group-label .n{
    color: var(--ink-faint);
    font-weight:500;
  }
  ul.events{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li.event{
    display:flex;
    gap:13px;
    padding: 13px 14px;
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    align-items:center;
  }
  .event-time{
    width:50px;
    flex-shrink:0;
    font-size:13px;
    font-weight:600;
    color: var(--moss-deep);
    background: var(--moss-soft);
    border-radius: 8px;
    padding: 5px 0;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .event-time.notime{ color: var(--ink-faint); background: var(--surface-soft); }
  .event-body{ flex:1; min-width:0; }
  .event-title{ font-size:15px; font-weight:500; line-height:1.4; }

  /* FAB */
  .fab{
    position:fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: calc(50% - 240px + 20px);
    width:58px; height:58px;
    border-radius:50%;
    background: var(--moss);
    color:white;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: var(--shadow-fab);
    cursor:pointer;
    transition: transform .12s ease;
    z-index: 20;
  }
  .fab:active{ transform: scale(.94); }
  @media (max-width: 480px){
    .fab{ right: 20px; }
  }

  /* Sheet */
  .sheet-overlay{
    position:fixed; inset:0;
    background: rgba(20,22,18,.42);
    z-index: 30;
    opacity:0;
    pointer-events:none;
    transition: opacity .22s ease;
    display:flex;
    justify-content:center;
    align-items:flex-end;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%;
    max-width:480px;
    background: var(--surface);
    border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 -8px 30px rgba(28,31,38,.14);
  }
  .sheet-overlay.open .sheet{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:4px; background: var(--line); border-radius: 999px;
    margin: 6px auto 16px;
  }
  .sheet-title{
    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:500;
    margin: 0 0 16px;
    font-variation-settings: 'opsz' 30;
  }
  .field-label{
    font-size:12px;
    font-weight:600;
    color: var(--ink-soft);
    margin: 0 0 8px;
    display:block;
  }
  .sheet input[type="text"]{
    width:100%;
    border:none;
    background: var(--surface-soft);
    border-radius: 12px;
    padding: 14px 14px;
    font-family:'Work Sans', sans-serif;
    font-size:15.5px;
    color: var(--ink);
    outline:none;
    margin-bottom:18px;
  }
  .sheet input::placeholder{ color: var(--ink-faint); }

  .date-strip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 2px 2px 6px;
    margin-bottom:18px;
    scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{ display:none; }
  .date-pill{
    flex-shrink:0;
    width:52px;
    padding: 10px 0 9px;
    border-radius: 14px;
    background: var(--surface-soft);
    border: 1.5px solid transparent;
    text-align:center;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .date-pill .dow{ font-size:11px; color: var(--ink-faint); font-weight:600; text-transform:lowercase; }
  .date-pill .num{ font-size:16px; color: var(--ink); font-weight:600; font-family:'Fraunces', serif; }
  .date-pill.selected{ background: var(--moss); }
  .date-pill.selected .dow{ color: var(--moss-soft); }
  .date-pill.selected .num{ color: white; }

  .time-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 22px;
    flex-wrap:wrap;
  }
  .time-chip{
    border:none;
    background: var(--surface-soft);
    color: var(--ink-soft);
    font-size:13px;
    font-weight:600;
    padding: 9px 13px;
    border-radius: 999px;
    cursor:pointer;
  }
  .time-chip.selected{ background: var(--moss); color: white; }
  .time-input-wrap{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sheet input[type="time"]{
    border:none;
    background: var(--surface-soft);
    border-radius: 10px;
    padding: 9px 10px;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    color: var(--ink);
    outline:none;
  }

  .sheet-submit{
    width:100%;
    border:none;
    background: var(--moss);
    color:white;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding: 15px 0;
    border-radius: 14px;
    cursor:pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .sheet-submit:disabled{ opacity:.4; }
  .sheet-submit:not(:disabled):active{ transform: scale(.98); }

  .loading{
    display:flex; align-items:center; justify-content:center;
    height:100vh; color: var(--ink-soft); font-size:14px;
  }

  /* ---------- Tela de entrada ---------- */
  .auth{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
  }
  .auth-mark{
    width:44px; height:44px;
    border-radius: 14px;
    background: var(--moss);
    color:white;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
  }
  .auth h1{
    font-family:'Fraunces', serif;
    font-size: 34px;
    font-weight:500;
    font-variation-settings: 'opsz' 40;
    letter-spacing:-0.01em;
    margin: 0 0 8px;
    line-height:1.1;
  }
  .auth .sub{
    font-size:14.5px;
    color: var(--ink-soft);
    margin: 0 0 28px;
    line-height:1.55;
  }
  .auth-card{
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 20px 18px;
  }
  .auth-card input{
    width:100%;
    border:none;
    background: var(--surface-soft);
    border-radius: 12px;
    padding: 14px;
    font-family:'Work Sans', sans-serif;
    font-size:15.5px;
    color: var(--ink);
    outline:none;
    margin-bottom:14px;
  }
  .auth-card input::placeholder{ color: var(--ink-faint); }
  .auth-submit{
    width:100%;
    border:none;
    background: var(--moss);
    color:white;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding: 15px 0;
    border-radius: 14px;
    cursor:pointer;
    margin-top: 4px;
    transition: opacity .15s ease, transform .1s ease;
  }
  .auth-submit:disabled{ opacity:.45; cursor:default; }
  .auth-submit:not(:disabled):active{ transform: scale(.98); }
  .auth-switch{
    text-align:center;
    font-size:13.5px;
    color: var(--ink-soft);
    margin: 18px 0 0;
  }
  .auth-switch button{
    border:none; background:none; padding:0;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px; font-weight:600;
    color: var(--moss);
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .auth-msg{
    font-size:13.5px;
    line-height:1.5;
    border-radius: 12px;
    padding: 11px 13px;
    margin-bottom: 14px;
  }
  .auth-msg.err{ background: #F6E2DE; color: #7C3125; }
  .auth-msg.ok{ background: var(--moss-soft); color: var(--moss-deep); }

  .setup-note{
    background: var(--amber-soft);
    color: #6B4712;
    border-radius: 12px;
    padding: 13px 14px;
    font-size:13px;
    line-height:1.55;
    margin-bottom:16px;
  }
  .setup-note code{ font-family: ui-monospace, monospace; font-size:12.5px; }

  /* toast */
  .toast{
    position:fixed;
    bottom: calc(96px + env(safe-area-inset-bottom));
    left:50%;
    transform: translate(-50%, 12px);
    background: var(--ink);
    color:white;
    font-size:13.5px;
    padding: 11px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }

  /* ---------- Tabs (agora com scroll horizontal p/ 6 abas) ---------- */
  .tabs-scroll{
    overflow-x:auto;
    scrollbar-width:none;
    margin: 0 -20px;
    padding: 0 20px;
  }
  .tabs-scroll::-webkit-scrollbar{ display:none; }
  .tabs{ width:max-content; min-width:100%; }
  .tabs button{ padding: 10px 16px; white-space:nowrap; flex:none; }

  /* ---------- Visão da Vida (home) ---------- */
  .home-greeting{
    font-family:'Fraunces', serif;
    font-size: 30px;
    font-weight:500;
    margin: 4px 0 2px;
    font-variation-settings: 'opsz' 40;
  }
  .home-date{ font-size:13.5px; color: var(--ink-soft); margin: 0 0 18px; }
  .home-grid{ display:flex; flex-direction:column; gap:10px; }
  .home-card{
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    padding: 15px 16px;
    display:flex;
    align-items:center;
    gap:13px;
    cursor:pointer;
    transition: box-shadow .15s ease, transform .1s ease;
  }
  .home-card:active{ transform: scale(.98); }
  .home-card .ic{
    width:38px; height:38px; border-radius:11px;
    background: var(--moss-soft); color: var(--moss-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .home-card .body{ flex:1; min-width:0; }
  .home-card .title{ font-size:14.5px; font-weight:600; color: var(--ink); }
  .home-card .sub{ font-size:12.5px; color: var(--ink-soft); margin-top:2px; }
  .home-card .chev{ color: var(--ink-faint); flex-shrink:0; }
  .home-card.attn .ic{ background: var(--amber-soft); color:#6B4712; }

  .ai-hero{
    margin-top: 6px;
    background: linear-gradient(135deg, var(--moss) 0%, var(--moss-deep) 100%);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    color: white;
    box-shadow: var(--shadow-md);
    cursor:pointer;
  }
  .ai-hero:active{ transform: scale(.98); }
  .ai-hero .label{ font-size:12px; font-weight:600; opacity:.85; text-transform:uppercase; letter-spacing:.04em; }
  .ai-hero .q{ font-family:'Fraunces', serif; font-size:19px; font-weight:500; margin: 6px 0 2px; line-height:1.3; }
  .ai-hero .hint{ font-size:12.5px; opacity:.8; margin-top:6px; }

  /* ---------- Genérico: cabeçalho de seção + botão IA ---------- */
  .section-top{ display:flex; align-items:center; justify-content:space-between; margin: 14px 4px 10px; }
  .section-hint{ font-size:12.5px; color: var(--ink-soft); margin: -2px 4px 12px; line-height:1.5; }
  .ai-btn{
    display:flex; align-items:center; gap:6px;
    border:none; background: var(--moss-soft); color: var(--moss-deep);
    font-family:'Work Sans', sans-serif; font-size:12.5px; font-weight:600;
    padding: 8px 13px; border-radius: 999px; cursor:pointer; flex-shrink:0;
  }
  .ai-btn:active{ transform: scale(.96); }
  .ai-btn[disabled]{ opacity:.5; }
  .ai-btn.big{ width:100%; justify-content:center; padding:13px 0; font-size:13.5px; margin-top:6px; }

  /* ---------- Quero Fazer ---------- */
  ul.wtd{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  li.wtd-item{
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-sm);
    padding: 13px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .wtd-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .wtd-title{ font-size:15px; font-weight:500; line-height:1.4; }
  .wtd-desc{ font-size:12.5px; color: var(--ink-soft); margin-top:3px; line-height:1.5; }
  .wtd-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .status-pill{
    font-size:11px; font-weight:600; padding: 5px 10px; border-radius:999px;
    background: var(--surface-soft); color: var(--ink-soft); border:none;
    font-family:'Work Sans', sans-serif; cursor:pointer;
  }
  .status-pill.s-quero{ background: var(--moss-soft); color: var(--moss-deep); }
  .status-pill.s-consid{ background: var(--amber-soft); color:#6B4712; }
  .status-pill.s-projeto{ background: var(--moss); color:white; }
  .status-pill.s-concluido{ background: var(--surface-soft); color: var(--ink-faint); text-decoration: line-through; }
  .status-pill.s-descartado{ background: var(--surface-soft); color: var(--ink-faint); }
  .wtd-cat{ font-size:11px; color: var(--ink-faint); font-weight:600; }
  .wtd-actions{ display:flex; gap:8px; margin-top:2px; }
  .mini-btn{
    border:none; background: var(--surface-soft); color: var(--ink-soft);
    font-family:'Work Sans', sans-serif; font-size:11.5px; font-weight:600;
    padding: 7px 11px; border-radius:10px; cursor:pointer;
  }
  .mini-btn.primary{ background: var(--moss); color:white; }
  .mini-btn.danger:active{ color: var(--clay); }

  /* ---------- Projetos ---------- */
  ul.projects{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li.project-card{
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm);
    padding: 15px 16px; cursor:pointer;
  }
  li.project-card:active{ transform: scale(.99); }
  .project-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .project-name{ font-size:15.5px; font-weight:600; }
  .project-cat{ font-size:11px; color: var(--ink-faint); font-weight:600; margin-bottom:10px; }
  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-bar-track{ flex:1; height:7px; background: var(--surface-soft); border-radius:999px; overflow:hidden; }

/* ============================================================

const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_ABR = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function todayKey(d = new Date()){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function lastNDays(n){
  const out = [];
  const d = new Date();
  for(let i = n-1; i >= 0; i--){
    const dd = new Date(d);
    dd.setDate(d.getDate() - i);
    out.push(todayKey(dd));
  }
  return out;
}
function nextNDays(n){
  const out = [];
  const d = new Date();
  for(let i = 0; i < n; i++){
    const dd = new Date(d);
    dd.setDate(d.getDate() + i);
    out.push(todayKey(dd));
  }
  return out;
}
function parseKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function dayGroupLabel(key){
  const today = todayKey();
  const tmr = todayKey(new Date(Date.now() + 86400000));
  if(key === today) return 'hoje';
  if(key === tmr) return 'amanhã';
  const date = parseKey(key);
  return `${DIAS_ABR[date.getDay()]}, ${date.getDate()} de ${MESES[date.getMonth()]}`;
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function uid(p){ return p + Date.now() + Math.random().toString(36).slice(2,6); }

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ============================================================
   3. ESTADO
   ============================================================ */
let session = null;          // sessão do Supabase (null = deslogado)
let screen  = 'auth';        // 'auth' | 'app'
let authMode = 'login';      // 'login' | 'signup'
let authMsg = null;          // { type:'err'|'ok', text }
let authBusy = false;

let view = 'home';            // 'home' | 'rotina' | 'agenda' | 'wtd' | 'projects' | 'week'
let sheetOpen = false;
let sheetKind = null;         // 'task' | 'event' | 'wtd' | 'project'
let selectedDate = todayKey();
let selectedTime = '';

let tasks = [];              // [{id, name}]
let log = {};                // { '2026-09-03': { taskId: true } }
let events = [];             // [{id, date, time, title}]

// ---- Novas entidades (painel pessoal) ----
let wantToDo = [];           // [{id,title,description,category,status,created_at}]
let projects = [];           // [{id,name,objective,description,category,status,created_at,deadline,cost_estimated,cost_actual,notes}]
let projectSteps = {};       // { projectId: [{id,name,done,position}] }
let weeklyPlans = {};        // { 'YYYY-W##': {priorities:[3], financial_goal, personal_goal, learn_goal, do_goal, self_goal} }

let quickOpen = false;                 // menu rápido do FAB (+)
let detailOpen = false;                // modal de detalhe
let detailKind = null;                 // 'project' | 'wtd'
let detailId = null;
let newStepDraft = '';
let aiState = { loading:false, kind:null, forId:null, suggestion:null }; // suggestion: texto ou objeto conforme o caso

const WTD_CATEGORIES = ['pessoal','aprendizado','viagem','saúde','financeiro','lazer','outro'];
const WTD_STATUS = [
  { v:'quero', label:'quero fazer' },
  { v:'consid', label:'em consideração' },
  { v:'projeto', label:'virou projeto' },
  { v:'concluido', label:'concluído' },
  { v:'descartado', label:'descartado' },
];
const PROJECT_CATEGORIES = ['renda extra','casa','carreira','saúde','aprendizado','viagem','financeiro','outro'];
const PROJECT_STATUS = [
  { v:'ativo', label:'ativo' },
  { v:'pausado', label:'pausado' },
  { v:'concluido', label:'concluído' },
];

function weekKey(d = new Date()){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt - firstThursday) / 86400000 - 3 + (firstThursday.getUTCDay()+6)%7) / 7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
function emptyWeek(){ return { priorities:['','',''], financial_goal:'', personal_goal:'', learn_goal:'', do_goal:'', self_goal:'' }; }
function currentWeek(){ const k = weekKey(); if(!weeklyPlans[k]) weeklyPlans[k] = emptyWeek(); return weeklyPlans[k]; }

/* ============================================================
   4. BACKEND
   Duas implementações com a mesma interface:
   - supabaseBackend: usado quando há login (dados na nuvem)
   - localBackend:    fallback offline no próprio navegador
   ============================================================ */
const localBackend = {
  cloud: false,
  read(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } },
  write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  async load(){
    tasks  = this.read('rotina.tasks', []);
    log    = this.read('rotina.log', {});
    events = this.read('rotina.events', []);
    wantToDo = this.read('rotina.wtd', []);
    projects = this.read('rotina.projects', []);
    projectSteps = this.read('rotina.steps', {});
    weeklyPlans = this.read('rotina.weeks', {});
  },
  async addTask(name){
    const t = { id: uid('t'), name };
    tasks.push(t);
    this.write('rotina.tasks', tasks);
    return t;
  },
  async removeTask(id){
    tasks = tasks.filter(t => t.id !== id);
    Object.keys(log).forEach(k => { delete log[k][id]; });
    this.write('rotina.tasks', tasks);
    this.write('rotina.log', log);
  },
  async setDone(){ this.write('rotina.log', log); },
  async addEvent(ev){
    const e = { id: uid('e'), ...ev };
    events.push(e);
    this.write('rotina.events', events);
    return e;
  },
  async removeEvent(id){
    events = events.filter(e => e.id !== id);
    this.write('rotina.events', events);
  },

  // ---- Quero Fazer ----
  async addWtd(item){
    const it = { id: uid('w'), description:'', category:'pessoal', status:'quero', created_at:new Date().toISOString(), ...item };
    wantToDo.unshift(it);
    this.write('rotina.wtd', wantToDo);
    return it;
  },
  async updateWtd(id, patch){
    wantToDo = wantToDo.map(w => w.id === id ? { ...w, ...patch } : w);
    this.write('rotina.wtd', wantToDo);
  },
  async removeWtd(id){
    wantToDo = wantToDo.filter(w => w.id !== id);
    this.write('rotina.wtd', wantToDo);
  },

  // ---- Projetos ----
  async addProject(p){
    const proj = { id: uid('p'), objective:'', description:'', category:'outro', status:'ativo',
      created_at:new Date().toISOString(), deadline:'', cost_estimated:null, cost_actual:null, notes:'', ...p };
    projects.unshift(proj);
    projectSteps[proj.id] = [];
    this.write('rotina.projects', projects);
    this.write('rotina.steps', projectSteps);
    return proj;
  },
  async updateProject(id, patch){
    projects = projects.map(p => p.id === id ? { ...p, ...patch } : p);
    this.write('rotina.projects', projects);
  },
  async removeProject(id){
    projects = projects.filter(p => p.id !== id);
    delete projectSteps[id];
    this.write('rotina.projects', projects);
    this.write('rotina.steps', projectSteps);
  },
  async addStep(projectId, name){
    const st = { id: uid('s'), name, done:false, position:(projectSteps[projectId]||[]).length };
    if(!projectSteps[projectId]) projectSteps[projectId] = [];
    projectSteps[projectId].push(st);
    this.write('rotina.steps', projectSteps);
    return st;
  },
  async toggleStep(projectId, stepId, done){
    const list = projectSteps[projectId] || [];
    const s = list.find(s => s.id === stepId);
    if(s) s.done = done;
    this.write('rotina.steps', projectSteps);
  },
  async removeStep(projectId, stepId){
    projectSteps[projectId] = (projectSteps[projectId]||[]).filter(s => s.id !== stepId);
    this.write('rotina.steps', projectSteps);
  },

  // ---- Semana ----
  async saveWeek(key, data){
    weeklyPlans[key] = data;
    this.write('rotina.weeks', weeklyPlans);
  }
};

const supabaseBackend = {
  cloud: true,
  async load(){
    const [tRes, lRes, eRes, wRes, pRes, sRes, wkRes] = await Promise.all([
      sb.from('tasks').select('id,name,position,created_at').order('position').order('created_at'),
      sb.from('task_logs').select('task_id,day').gte('day', lastNDays(60)[0]),
      sb.from('events').select('id,title,event_date,event_time').order('event_date').order('event_time'),
      sb.from('want_to_do').select('*').order('created_at', { ascending:false }),
      sb.from('projects').select('*').order('created_at', { ascending:false }),
      sb.from('project_steps').select('*').order('position'),
      sb.from('weekly_plans').select('*')
    ]);
    if(tRes.error || lRes.error || eRes.error){
      throw (tRes.error || lRes.error || eRes.error);
    }
    tasks = tRes.data.map(r => ({ id: r.id, name: r.name }));
    log = {};
    lRes.data.forEach(r => {
      if(!log[r.day]) log[r.day] = {};
      log[r.day][r.task_id] = true;
    });
    events = eRes.data.map(r => ({
      id: r.id,
      title: r.title,
      date: r.event_date,
      time: r.event_time ? String(r.event_time).slice(0,5) : ''
    }));

    // Tabelas novas: se ainda não existirem no banco, seguimos com listas vazias
    // em vez de quebrar o app (assim dá pra rodar o SQL depois, com calma).
    wantToDo = wRes.error ? [] : wRes.data;
    projects = pRes.error ? [] : pRes.data;
    projectSteps = {};
    if(!sRes.error){
      sRes.data.forEach(s => {
        if(!projectSteps[s.project_id]) projectSteps[s.project_id] = [];
        projectSteps[s.project_id].push({ id: s.id, name: s.name, done: s.done, position: s.position });
      });
    }
    weeklyPlans = {};
    if(!wkRes.error){
      wkRes.data.forEach(w => {
        weeklyPlans[w.week_key] = {
          priorities: w.priorities || ['','',''],
          financial_goal: w.financial_goal || '',
          personal_goal: w.personal_goal || '',
          learn_goal: w.learn_goal || '',
          do_goal: w.do_goal || '',
          self_goal: w.self_goal || ''
        };
      });
    }
    if(wRes.error) console.warn('want_to_do: rode o SQL novo no Supabase.', wRes.error.message);
    if(pRes.error) console.warn('projects: rode o SQL novo no Supabase.', pRes.error.message);
  },
  async addTask(name){
    const { data, error } = await sb.from('tasks')
      .insert({ name, position: tasks.length })
      .select('id,name').single();
    if(error) throw error;
    const t = { id: data.id, name: data.name };
    tasks.push(t);
    return t;
  },
  async removeTask(id){
    const before = tasks;
    tasks = tasks.filter(t => t.id !== id);
    const { error } = await sb.from('tasks').delete().eq('id', id);
    if(error){ tasks = before; throw error; }
    Object.keys(log).forEach(k => { delete log[k][id]; });
  },
  async setDone(taskId, day, done){
    if(done){
      const { error } = await sb.from('task_logs')
        .upsert({ task_id: taskId, day }, { onConflict: 'task_id,day' });
      if(error) throw error;
    } else {
      const { error } = await sb.from('task_logs')
        .delete().eq('task_id', taskId).eq('day', day);
      if(error) throw error;
    }
  },
  async addEvent(ev){
    const { data, error } = await sb.from('events')
      .insert({ title: ev.title, event_date: ev.date, event_time: ev.time || null })
      .select('id,title,event_date,event_time').single();
    if(error) throw error;
    const e = {
      id: data.id, title: data.title, date: data.event_date,
      time: data.event_time ? String(data.event_time).slice(0,5) : ''
    };
    events.push(e);
    return e;
  },
  async removeEvent(id){
    const before = events;
    events = events.filter(e => e.id !== id);
    const { error } = await sb.from('events').delete().eq('id', id);
    if(error){ events = before; throw error; }
  },

  // ---- Quero Fazer ----
  async addWtd(item){
    const row = { title:item.title, description:item.description||'', category:item.category||'pessoal', status:item.status||'quero' };
    const { data, error } = await sb.from('want_to_do').insert(row).select('*').single();
    if(error) throw error;
    wantToDo.unshift(data);
    return data;
  },
  async updateWtd(id, patch){
    const before = wantToDo;
    wantToDo = wantToDo.map(w => w.id === id ? { ...w, ...patch } : w);
    const { error } = await sb.from('want_to_do').update(patch).eq('id', id);
    if(error){ wantToDo = before; throw error; }
  },
  async removeWtd(id){
    const before = wantToDo;
    wantToDo = wantToDo.filter(w => w.id !== id);
    const { error } = await sb.from('want_to_do').delete().eq('id', id);
    if(error){ wantToDo = before; throw error; }
  },

  // ---- Projetos ----
  async addProject(p){
    const row = {
      name:p.name, objective:p.objective||'', description:p.description||'', category:p.category||'outro',
      status:p.status||'ativo', deadline:p.deadline||null, cost_estimated:p.cost_estimated||null,
      cost_actual:p.cost_actual||null, notes:p.notes||''
    };
    const { data, error } = await sb.from('projects').insert(row).select('*').single();
    if(error) throw error;
    projects.unshift(data);
    projectSteps[data.id] = [];
    return data;
  },
  async updateProject(id, patch){
    const before = projects;
    projects = projects.map(p => p.id === id ? { ...p, ...patch } : p);
    const { error } = await sb.from('projects').update(patch).eq('id', id);
    if(error){ projects = before; throw error; }
  },
  async removeProject(id){
    const before = projects;
    projects = projects.filter(p => p.id !== id);
    delete projectSteps[id];
    const { error } = await sb.from('projects').delete().eq('id', id);
    if(error){ projects = before; throw error; }
  },
  async addStep(projectId, name){
    const position = (projectSteps[projectId]||[]).length;
    const { data, error } = await sb.from('project_steps')
      .insert({ project_id: projectId, name, done:false, position }).select('*').single();
    if(error) throw error;
    if(!projectSteps[projectId]) projectSteps[projectId] = [];
    const st = { id:data.id, name:data.name, done:data.done, position:data.position };
    projectSteps[projectId].push(st);
    return st;
  },
  async toggleStep(projectId, stepId, done){
    const list = projectSteps[projectId] || [];
    const s = list.find(s => s.id === stepId);
    if(s) s.done = done;
    const { error } = await sb.from('project_steps').update({ done }).eq('id', stepId);
    if(error) throw error;
  },
  async removeStep(projectId, stepId){
    projectSteps[projectId] = (projectSteps[projectId]||[]).filter(s => s.id !== stepId);
    const { error } = await sb.from('project_steps').delete().eq('id', stepId);
    if(error) throw error;
  },

  // ---- Semana ----
  async saveWeek(key, data){
    weeklyPlans[key] = data;
    const { error } = await sb.from('weekly_plans').upsert({
      week_key:key, priorities:data.priorities, financial_goal:data.financial_goal,
      personal_goal:data.personal_goal, learn_goal:data.learn_goal, do_goal:data.do_goal, self_goal:data.self_goal
    }, { onConflict:'user_id,week_key' });
    if(error) throw error;
  }
};

function isDone(id, key = todayKey()){
  return !!(log[key] && log[key][id]);
}
async function toggleDone(id){
  const key = todayKey();
  const next = !isDone(id, key);
  if(!log[key]) log[key] = {};
  if(next) log[key][id] = true; else delete log[key][id];
  render();
  try{
    await backend.setDone(id, key, next);
  }catch(e){
    if(next) delete log[key][id]; else log[key][id] = true;
    render();
    toast('não deu para salvar. verifique a conexão.');
  }
}
function streakDots(id){
  return lastNDays(5).map(k => isDone(id, k) ? 'hit' : '');
}

/* ============================================================
   7. IA — assistente de planejamento pessoal
   ------------------------------------------------------------
   A IA NUNCA decide nada sozinha: ela só sugere, e o usuário
   aceita, edita ou ignora. Nada é salvo sem confirmação.

   SEGURANÇA: nenhuma chave de API de IA fica aqui no navegador.
   AI_ENDPOINT deve apontar para uma função server-side sua
   (ex: Supabase Edge Function, Vercel Function, Cloudflare Worker)
   que guarda a chave real e repassa a chamada para o provedor de IA.

   Contrato esperado do endpoint:
     POST { kind: 'project_plan' | 'week_plan' | 'priority', payload }
     → 200 { result: {...} }  (o formato de "result" varia por kind,
       ver os três blocos abaixo)

   Enquanto AI_ENDPOINT não estiver configurado, o app usa um
   gerador local simples (heurística, não é IA de verdade) só
   para a experiência não ficar quebrada em desenvolvimento.
   ============================================================ */
const AI_ENDPOINT = ''; // DEVELOPMENT ONLY: deixe vazio para usar o gerador local. Ex: 'https://SEU-PROJETO.functions.supabase.co/ai-assistant'

async function callAI(kind, payload){
  if(AI_ENDPOINT){
    const res = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ kind, payload })
    });
    if(!res.ok) throw new Error('IA indisponível no momento.');
    const data = await res.json();
    return data.result;
  }
  await new Promise(r => setTimeout(r, 550)); // simula latência
  return localAiFallback(kind, payload);
}

function localAiFallback(kind, payload){
  if(kind === 'project_plan'){
    const name = (payload.name || '').trim();
    return {
      objective: `Avançar de forma consistente em "${name}" até ter um resultado concreto e visível.`,
      steps: [
        'Definir claramente o que significa "concluído" aqui',
        'Levantar o que já tenho disponível para começar',
        'Quebrar em 3 a 5 blocos de trabalho pequenos',
        'Reservar um horário fixo na semana para avançar',
        'Fazer a primeira etapa, mesmo que pequena',
        'Revisar o progresso e ajustar o plano'
      ]
    };
  }
  if(kind === 'week_plan'){
    const activeProjects = projects.filter(p => p.status === 'ativo').slice(0,2);
    const pending = activeProjects.map(p => `Avançar 1 etapa de "${p.name}"`);
    while(pending.length < 3){
      const idea = wantToDo.find(w => w.status === 'quero');
      pending.push(idea ? `Explorar "${idea.title}"` : 'Cuidar de algo pendente da rotina');
    }
    return {
      priorities: pending.slice(0,3),
      financial_goal: '',
      personal_goal: 'Cuidar do corpo pelo menos 3x',
      learn_goal: '',
      do_goal: '',
      self_goal: 'Ter uma pausa de verdade em algum momento'
    };
  }
  if(kind === 'priority'){
    const active = projects.filter(p => p.status === 'ativo');
    if(active.length === 0){
      return `Você ainda não tem projetos ativos. Que tal escolher 1 item de "Quero Fazer" e transformá-lo em projeto? É mais fácil priorizar quando existe algo concreto em andamento.`;
    }
    const withProgress = active.map(p => {
      const steps = projectSteps[p.id] || [];
      const done = steps.filter(s => s.done).length;
      const pct = steps.length ? Math.round((done/steps.length)*100) : 0;
      return { p, pct, steps: steps.length };
    }).sort((a,b) => b.pct - a.pct);

    let text = `Você está tentando avançar em ${active.length} projeto${active.length>1?'s':''} ao mesmo tempo.\n\nMinha sugestão:\n\n`;
    withProgress.forEach((item, i) => {
      const reason = item.pct >= 50 ? 'já está mais avançado, vale terminar primeiro'
        : item.steps === 0 ? 'ainda não tem etapas definidas — comece por aí'
        : 'está no meio do caminho, dá pra avançar em blocos pequenos';
      text += `${i+1}. ${item.p.name}\n   ${reason}.\n\n`;
    });
    text += `Para esta semana, eu focaria no primeiro da lista e trataria os demais como "se sobrar tempo".`;
    return text;
  }
  return '';
}

async function runProjectAI(projectId){
  const p = projects.find(p => p.id === projectId);
  if(!p) return;
  aiState = { loading:true, kind:'project_plan', forId:projectId, suggestion:null };
  render();
  try{
    const result = await callAI('project_plan', { name:p.name, objective:p.objective, category:p.category, description:p.description });
    aiState = { loading:false, kind:'project_plan', forId:projectId, suggestion:result };
  }catch(e){
    aiState = { loading:false, kind:null, forId:null, suggestion:null };
    toast('a IA não respondeu. tente de novo em instantes.');
  }
  render();
}
async function acceptProjectAI(){
  if(!aiState.suggestion || aiState.kind !== 'project_plan') return;
  const projectId = aiState.forId;
  const sug = aiState.suggestion;
  try{
    if(sug.objective){
      await backend.updateProject(projectId, { objective: sug.objective });
    }
    for(const stepName of (sug.steps || [])){
      await backend.addStep(projectId, stepName);
    }
  }catch(e){ toast('não deu para aplicar tudo. tente de novo.'); }
  aiState = { loading:false, kind:null, forId:null, suggestion:null };
  render();
}

async function runWeekAI(){
  aiState = { loading:true, kind:'week_plan', forId:null, suggestion:null };
  render();
  try{
    const result = await callAI('week_plan', {
      projects: projects.filter(p=>p.status==='ativo').map(p=>({ name:p.name, steps:(projectSteps[p.id]||[]).filter(s=>!s.done).length })),

  }

}
async function acceptWeekAI(){
  if(!aiState.suggestion || aiState.kind !== 'week_plan') return;
  const sug = aiState.suggestion;

}

async function runPriorityAI(){

function renderAgenda(){

        <p>Sua agenda está vazia.<br>Toque no + para marcar um compromisso no dia e horário que quiser.</p>
      </div>
    `;
  }
  const today = todayKey();
  const upcoming = events
    .filter(e => e.date >= today)
    .sort((a,b) => (a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')));
  const past = events
    .filter(e => e.date < today)
    .sort((a,b) => (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  const ordered = [...upcoming, ...past];

  const groups = [];
  ordered.forEach(e => {
    let g = groups.find(g => g.key === e.date);
    if(!g){ g = { key: e.date, items: [] }; groups.push(g); }
    g.items.push(e);
  });

  return groups.map(g => `
    <div class="day-group">
      <p class="day-group-label">${dayGroupLabel(g.key)} <span class="n">· ${g.items.length}</span></p>
      <ul class="events">
        ${g.items.map(e => `

}

          <p class="ai-title">Sugestão de semana</p>
          ${s.priorities.map((p,i)=>`${i+1}. ${escapeHtml(p)}`).join('\n')}
          ${s.personal_goal ? `\n🏃 ${escapeHtml(s.personal_goal)}` : ''}
          ${s.self_goal ? `\n❤️ ${escapeHtml(s.self_goal)}` : ''}
          <div class="ai-panel-actions">
            <button class="mini-btn" id="ai-dismiss">ignorar</button>
            <button class="mini-btn primary" id="ai-accept-week">usar esta semana</button>
          </div>
        </div>`;
    }
  }
  return '';
}

/* ---------- Projetos ---------- */
function renderProjects(){
  return `
    <div class="section-top">
      <span class="section-hint" style="margin:0;">coisas que você decidiu realmente executar</span>
    </div>
    ${projects.length === 0 ? `
      <div class="empty-state">

      <ul class="projects">

          return `
            <li class="project-card" data-project-open="${p.id}">
              <div class="project-top">
                <div class="project-name">${escapeHtml(p.name)}</div>
                <span class="status-tag ${p.status}">${p.status}</span>

              <div class="project-cat">${escapeHtml(p.category || 'outro')}</div>

              <div class="project-foot">
                <span>${steps.length ? `${done}/${steps.length} etapas` : 'sem etapas ainda'}</span>

function formatDatePt(key){
  const d = parseKey(key);
  return `${d.getDate()} de ${MESES[d.getMonth()]}`;
}

  const done = steps.filter(s => s.done).length;

    <div class="detail-overlay ${detailOpen ? 'open' : ''}" id="detail-overlay">

          <span class="status-tag ${p.status}">${p.status}</span>

              <span class="field-label">status</span>

            <div class="ai-panel">
              <p class="ai-title">Sugestão da IA</p>
              <strong>Objetivo:</strong> ${escapeHtml(aiState.suggestion.objective)}
              ${'\n\nEtapas:\n' + aiState.suggestion.steps.map((s,i)=>`${i+1}. ${escapeHtml(s)}`).join('\n')}

                <button class="mini-btn" id="ai-dismiss">ignorar</button>

          <div class="field-group" style="margin-top:20px;">

function openQuickMenu(){ quickOpen = true; render(); }
function closeQuickMenu(){ quickOpen = false; render(); }

function openSheet(kind){
  sheetKind = kind;
  selectedDate = todayKey();
  selectedTime = '';
  sheetOpen = true;
  render();
  const idMap = { task:'new-task', event:'new-event-title', wtd:'new-wtd-title', project:'new-project-name' };
  const input = document.getElementById(idMap[kind]);
  if(input) setTimeout(() => input.focus(), 250);
}
function closeSheet(){
  sheetOpen = false;
  render();
  setTimeout(() => { sheetKind = null; }, 260);
}

function openDetail(kind, id){
  detailKind = kind; detailId = id; detailOpen = true;
  aiState = { loading:false, kind:null, forId:null, suggestion:null };
  render();
}
function closeDetail(){
  detailOpen = false;
  render();
  setTimeout(() => { detailKind = null; detailId = null; }, 260);
}

function viewBody(){
  switch(view){
    case 'home': return renderHome();
    case 'rotina': return renderRotina();
    case 'agenda': return renderAgenda();
    case 'wtd': return renderWantToDo();
    case 'projects': return renderProjects();
    case 'week': return renderWeek();
    default: return renderHome();
  }
}

function render(){
  const app = document.getElementById('app');

  if(screen === 'auth'){
    app.innerHTML = renderAuth();
    bindAuth(app);
    return;
  }

  app.innerHTML = `
    ${renderHeader()}
    <main>
      ${ viewBody() }
    </main>
    <button class="fab" id="fab" aria-label="adicionar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    ${renderSheet()}
    ${renderQuickMenu()}
    ${renderDetailModal()}
  `;

  const signoutBtn = document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click', signOut);

  // tabs
  app.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      view = btn.dataset.view;
      render();
    });
  });

  // navegação a partir da home
  app.querySelectorAll('[data-view]').forEach(el => {
    if(el.tagName === 'BUTTON' && el.closest('.tabs')) return; // já tratado acima
    el.addEventListener('click', () => { view = el.dataset.view; render(); });
  });
  app.querySelectorAll('[data-project-open]').forEach(el => {
    el.addEventListener('click', () => openDetail('project', el.dataset.projectOpen));
  });

  // ai hero (o que devo priorizar?)
  const prioBtn = document.getElementById('priority-ai-btn');
  if(prioBtn) prioBtn.addEventListener('click', runPriorityAI);
  const weekAiBtn = document.getElementById('week-ai-btn');
  if(weekAiBtn) weekAiBtn.addEventListener('click', runWeekAI);
  const aiDismiss = document.getElementById('ai-dismiss');
  if(aiDismiss) aiDismiss.addEventListener('click', dismissAI);
  const aiAcceptWeek = document.getElementById('ai-accept-week');
  if(aiAcceptWeek) aiAcceptWeek.addEventListener('click', acceptWeekAI);

  // rotina actions
  app.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => toggleDone(btn.dataset.id));
  });
  app.querySelectorAll('[data-action="remove-task"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try{
        await backend.removeTask(btn.dataset.id);
        render();
      }catch(e){
        render();
        toast('não deu para remover a tarefa.');
      }
    });
  });
  app.querySelectorAll('[data-action="remove-event"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try{
        await backend.removeEvent(btn.dataset.id);
        render();
      }catch(e){
        render();
        toast('não deu para remover o compromisso.');
      }
    });
  });

  // quero fazer: remover / status / virar projeto
  app.querySelectorAll('[data-action="remove-wtd"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try{ await backend.removeWtd(btn.dataset.id); render(); }
      catch(e){ toast('não deu para remover.'); }
    });
  });
  app.querySelectorAll('[data-action="wtd-status"]').forEach(sel => {
    sel.addEventListener('change', async () => {
      try{ await backend.updateWtd(sel.dataset.id, { status: sel.value }); render(); }
      catch(e){ toast('não deu para atualizar.'); render(); }
    });
  });
  app.querySelectorAll('[data-action="wtd-to-project"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const w = wantToDo.find(w => w.id === btn.dataset.id);
      if(!w) return;
      try{
        await backend.updateWtd(w.id, { status: 'projeto' });
        const proj = await backend.addProject({ name: w.title, category: mapWtdCategoryToProject(w.category), description: w.description || '' });
        view = 'projects';
        render();
        openDetail('project', proj.id);
      }catch(e){ toast('não deu para transformar em projeto.'); }
    });
  });

  // fab + menu rápido
  document.getElementById('fab').addEventListener('click', openQuickMenu);
  const quickOverlay = document.getElementById('quick-overlay');
  if(quickOverlay){
    quickOverlay.addEventListener('click', (e) => { if(e.target === quickOverlay) closeQuickMenu(); });
    quickOverlay.querySelectorAll('[data-quick]').forEach(opt => {
      opt.addEventListener('click', () => {
        const kind = opt.dataset.quick;
        closeQuickMenu();
        setTimeout(() => openSheet(kind), 200);
      });
    });
  }

  // sheet de criação (tarefa / compromisso / quero fazer / projeto)
  const overlay = document.getElementById('sheet-overlay');
  if(overlay){
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeSheet(); });
    const form = document.getElementById('add-form');
    const submitBtn = document.getElementById('submit-btn');

    if(sheetKind === 'task'){
      const input = document.getElementById('new-task');
      input.addEventListener('input', () => { submitBtn.disabled = !input.value.trim(); });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if(!name) return;
        submitBtn.disabled = true; submitBtn.textContent = 'salvando…';
        try{ await backend.addTask(name); closeSheet(); }
        catch(err){ submitBtn.disabled = false; submitBtn.textContent = 'adicionar tarefa'; toast('não deu para salvar a tarefa.'); }
      });

    } else if(sheetKind === 'wtd'){
      const input = document.getElementById('new-wtd-title');
      let cat = 'pessoal';
      input.addEventListener('input', () => { submitBtn.disabled = !input.value.trim(); });
      overlay.querySelectorAll('[data-cat]').forEach(chip => {
        chip.addEventListener('click', () => {
          cat = chip.dataset.cat;
          overlay.querySelectorAll('[data-cat]').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        });
      });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = input.value.trim();
        if(!title) return;
        submitBtn.disabled = true; submitBtn.textContent = 'salvando…';
        try{ await backend.addWtd({ title, category: cat }); closeSheet(); }
        catch(err){ submitBtn.disabled = false; submitBtn.textContent = 'adicionar'; toast('não deu para salvar.'); }
      });

    } else if(sheetKind === 'project'){
      const input = document.getElementById('new-project-name');
      input.addEventListener('input', () => { submitBtn.disabled = !input.value.trim(); });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if(!name) return;
        submitBtn.disabled = true; submitBtn.textContent = 'criando…';
        try{
          const proj = await backend.addProject({ name });
          closeSheet();
          setTimeout(() => openDetail('project', proj.id), 220);
        }catch(err){ submitBtn.disabled = false; submitBtn.textContent = 'criar e detalhar'; toast('não deu para criar o projeto.'); }
      });

    } else { // event
      const titleInput = document.getElementById('new-event-title');
      const timeInput = document.getElementById('time-input');
      function refreshSubmit(){ submitBtn.disabled = !titleInput.value.trim(); }
      titleInput.addEventListener('input', refreshSubmit);
      refreshSubmit();

      overlay.querySelectorAll('.date-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          selectedDate = pill.dataset.date;
          overlay.querySelectorAll('.date-pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
        });
      });
      overlay.querySelectorAll('.time-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          selectedTime = chip.dataset.time;
          timeInput.value = selectedTime;
          overlay.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        });
      });
      timeInput.addEventListener('input', () => {
        selectedTime = timeInput.value;
        overlay.querySelectorAll('.time-chip').forEach(c => c.classList.toggle('selected', c.dataset.time === selectedTime));
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = titleInput.value.trim();
        if(!title) return;
        submitBtn.disabled = true; submitBtn.textContent = 'salvando…';
        try{ await backend.addEvent({ title, date: selectedDate, time: timeInput.value || '' }); closeSheet(); }
        catch(err){ submitBtn.disabled = false; submitBtn.textContent = 'adicionar à agenda'; toast('não deu para salvar o compromisso.'); }
      });
    }
  }

  // modal de detalhe do projeto
  const detailOverlayEl = document.getElementById('detail-overlay');
  if(detailOverlayEl){
    const closeBtn = document.getElementById('detail-close');
    if(closeBtn) closeBtn.addEventListener('click', closeDetail);

    const p = projects.find(p => p.id === detailId);
    if(p){
      const nameInput = document.getElementById('proj-name');
      const objInput = document.getElementById('proj-objective');
      const catSel = document.getElementById('proj-category');
      const statusSel = document.getElementById('proj-status');
      const deadlineInput = document.getElementById('proj-deadline');
      const notesInput = document.getElementById('proj-notes');

      const saveField = async (patch) => {
        try{ await backend.updateProject(p.id, patch); }
        catch(e){ toast('não deu para salvar essa alteração.'); }
      };
      nameInput.addEventListener('blur', () => { if(nameInput.value.trim()) saveField({ name: nameInput.value.trim() }); });
      objInput.addEventListener('blur', () => saveField({ objective: objInput.value }));
      notesInput.addEventListener('blur', () => saveField({ notes: notesInput.value }));
      catSel.addEventListener('change', () => saveField({ category: catSel.value }));
      statusSel.addEventListener('change', async () => { await saveField({ status: statusSel.value }); render(); });
      deadlineInput.addEventListener('change', () => saveField({ deadline: deadlineInput.value || null }));

      const stepInput = document.getElementById('new-step-input');
      const addStepBtn = document.getElementById('add-step-btn');
      const submitNewStep = async () => {
        const name = stepInput.value.trim();
        if(!name) return;
        try{ await backend.addStep(p.id, name); render(); openDetail('project', p.id); }
        catch(e){ toast('não deu para adicionar a etapa.'); }
      };
      addStepBtn.addEventListener('click', submitNewStep);
      stepInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); submitNewStep(); } });

      app.querySelectorAll('[data-action="toggle-step"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const list = projectSteps[p.id] || [];
          const s = list.find(s => s.id === btn.dataset.id);
          const nextDone = !(s && s.done);
          try{ await backend.toggleStep(p.id, btn.dataset.id, nextDone); render(); openDetail('project', p.id); }
          catch(e){ toast('não deu para atualizar a etapa.'); }
        });
      });
      app.querySelectorAll('[data-action="remove-step"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try{ await backend.removeStep(p.id, btn.dataset.id); render(); openDetail('project', p.id); }
          catch(e){ toast('não deu para remover a etapa.'); }
        });
      });

      const aiBtn = document.getElementById('proj-ai-btn');
      if(aiBtn) aiBtn.addEventListener('click', () => runProjectAI(p.id));
      const aiAcceptProj = document.getElementById('ai-accept-project');
      if(aiAcceptProj) aiAcceptProj.addEventListener('click', async () => { await acceptProjectAI(); openDetail('project', p.id); });
      const aiDismissProj = document.getElementById('ai-dismiss');
      if(aiDismissProj) aiDismissProj.addEventListener('click', () => { dismissAI(); openDetail('project', p.id); });

      const delBtn = document.getElementById('proj-delete');
      if(delBtn) delBtn.addEventListener('click', async () => {
        if(!confirm(`excluir o projeto "${p.name}"? essa ação não pode ser desfeita.`)) return;
        try{ await backend.removeProject(p.id); closeDetail(); }
        catch(e){ toast('não deu para excluir o projeto.'); }
      });
    }
  }

  // semana: campos de texto
  app.querySelectorAll('[data-week-field]').forEach(input => {
    input.addEventListener('blur', async () => {
      const wk = { ...emptyWeek(), ...currentWeek() };
      const field = input.dataset.weekField;
      if(field === 'priorities'){
        wk.priorities[Number(input.dataset.idx)] = input.value;
      } else {
        wk[field] = input.value;
      }
      try{ await backend.saveWeek(weekKey(), wk); }
      catch(e){ toast('não deu para salvar a semana.'); }
    });
  });
}

function mapWtdCategoryToProject(cat){
  const map = { aprendizado:'aprendizado', viagem:'viagem', financeiro:'financeiro', saúde:'saúde' };
  return map[cat] || 'outro';
}

function bindAuth(app){
  const form = document.getElementById('auth-form');
  const emailEl = document.getElementById('auth-email');
  const passEl = document.getElementById('auth-pass');

  document.getElementById('auth-switch').addEventListener('click', () => {
    authMode = authMode === 'login' ? 'signup' : 'login';
    authMsg = null;
    render();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const password = passEl.value;
    if(!email || password.length < 6){
      authMsg = { type:'err', text:'preencha o e-mail e uma senha de 6 caracteres ou mais.' };
      return render();
    }
    if(!CONFIGURED){
      // sem Supabase configurado: segue direto no modo local
      screen = 'app';
      await backend.load();
      return render();
    }
    authBusy = true; authMsg = null; render();
    try{
      const s = authMode === 'signup'
        ? await signUp(email, password)
        : await signIn(email, password);

      if(!s){
        // conta criada, mas o projeto exige confirmação por e-mail
        authBusy = false;
        authMode = 'login';
        authMsg = { type:'ok', text:'conta criada. confirme o e-mail que enviamos e volte para entrar.' };
        return render();
      }
      session = s;
      await enterApp();
    }catch(err){
      authBusy = false;
      authMsg = { type:'err', text: authErrorText(err) };
      render();
    }
  });

  setTimeout(() => emailEl && emailEl.focus(), 120);
}

async function enterApp(){
  try{
    await backend.load();
  }catch(e){
    toast('não deu para carregar seus dados. rode o script SQL no Supabase.');
  }
  authBusy = false;
  screen = 'app';
  render();
}

/* ============================================================
   9. BOOT
   ============================================================ */
(async function init(){
  if(!CONFIGURED){
    backend = localBackend;
    screen = 'auth';   // continua pedindo e-mail/senha, mas roda local
    return render();
  }

  const { data } = await sb.auth.getSession();
  session = data.session;

  sb.auth.onAuthStateChange((_evt, s) => {
    const wasLogged = !!session;
    session = s;
    if(!s && wasLogged){
      screen = 'auth';
      tasks = []; log = {}; events = []; wantToDo = []; projects = []; projectSteps = {}; weeklyPlans = {};
      render();
    }
  });

  if(session){
    await enterApp();
  } else {
    screen = 'auth';
    render();
  }
})();
</script>
